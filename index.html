<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym check-in</title>
<meta name="theme-color" content="#f2f0ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css?v=7">
</head><body><div id="root"></div>
<script src="app.js?v=7"></script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script>
<script>
(function(){
try{
var stored=localStorage.getItem('gym-code.v1');
if(!stored||!window.Capacitor||!Capacitor.Plugins||!Capacitor.Plugins.Preferences)return;
var code=stored.slice(1);
fetch('https://vlbzvwmbcjxihlcgkped.supabase.co/rest/v1/rpc/gym_state',{method:'POST',headers:{apikey:'sb_publishable_WTYpx355WH8AjHrSwgTFOg_ZW0nXele','Content-Type':'application/json'},body:JSON.stringify({p_code:code})}).then(function(r){return r.json()}).then(function(j){
if(!j.ok){Capacitor.Plugins.Preferences.remove({key:'gymGeofence'}).catch(function(){});return;}
if(j.role!=='mom'||!j.gym){Capacitor.Plugins.Preferences.remove({key:'gymGeofence'}).catch(function(){});return;}
Capacitor.Plugins.Preferences.set({key:'gymGeofence',value:JSON.stringify({code:code,lat:j.gym.lat,lon:j.gym.lon,radius:j.gym.radius})}).catch(function(){});
}).catch(function(){});
}catch(e){}
})();
</script>
</body></html>
